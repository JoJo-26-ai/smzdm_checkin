name: 什么值得买签到

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python smzdm_checkin.py
        env:
          SMZDM_COOKIE: ${{ secrets.SMZDM_COOKIE }}
